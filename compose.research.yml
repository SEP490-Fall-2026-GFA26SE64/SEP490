# Use with: docker compose -f compose.dev.yml -f compose.research.yml up --build -d
services:
  # Keep the idle operational graph small while measuring the separate research instance.
  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474/"]
  neo4j-research:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${RESEARCH_NEO4J_PASSWORD:-local-only-research-neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    cpus: 2.0
    mem_limit: 2g
    ports:
      - "127.0.0.1:${RESEARCH_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${RESEARCH_NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - research_neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474/"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
  api:
    environment:
      RESEARCH_ENABLED: "true"
      RESEARCH_SOURCE: /app/research/ontology_seed.json
      RESEARCH_RULES: /app/research/RULES.md
      RESEARCH_NEO4J_URI: bolt://neo4j-research:7687
      RESEARCH_NEO4J_PASSWORD: ${RESEARCH_NEO4J_PASSWORD:-local-only-research-neo4j}
      RESEARCH_ENVIRONMENT_LABEL: "Docker Compose; Neo4j limit 2 CPU / 2 GiB; heap 512 MiB; page cache 256 MiB; shared host"
    volumes:
      - ./documents/dataset/import/ontology_seed.json:/app/research/ontology_seed.json:ro
      - ./documents/research/RQ2/RULES.md:/app/research/RULES.md:ro
    depends_on:
      neo4j:
        condition: service_healthy
        restart: true
      neo4j-research:
        condition: service_healthy
        restart: true
volumes:
  research_neo4j_data:
