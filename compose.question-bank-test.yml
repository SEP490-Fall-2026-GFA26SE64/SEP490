# Disposable, opt-in acceptance environment. Never attaches to development volumes.
name: sep490-question-bank-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: question_bank_test
      POSTGRES_USER: question_bank_test
      POSTGRES_PASSWORD: question-bank-test-only
    ports: ['127.0.0.1:28432:5432']
    volumes: [question_bank_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U question_bank_test -d question_bank_test']
      interval: 3s
      timeout: 3s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/question-bank-test-only
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_server_jvm_additional: -XX:ActiveProcessorCount=2
    ports: ['127.0.0.1:28474:7474', '127.0.0.1:28487:7687']
    volumes: [question_bank_graph:/data]
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ['127.0.0.1:28425:8025', '127.0.0.1:28426:1025']
  api:
    image: adapt-learn-graph-backend:dev
    entrypoint: [java]
    command: ['-XX:ActiveProcessorCount=2', '-Xms64m', '-Xmx384m', '-Dloader.main=com.adaptlearngraph.assessment.bank.QuestionBankTestRuntime', '-cp', '/app/question-bank-test.jar', 'org.springframework.boot.loader.launch.PropertiesLauncher']
    environment:
      ISOLATED_QUESTION_BANK_TEST: 'true'
      SPRING_PROFILES_ACTIVE: local,workspace-baseline
      SPRING_FLYWAY_ENABLED: 'true'
      DB_URL: jdbc:postgresql://postgres:5432/question_bank_test
      DB_USER: question_bank_test
      DB_PASSWORD: question-bank-test-only
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: question-bank-test-only
      CATALOG_SEED_ENABLED: 'false'
      CATALOG_LOCAL_ACTOR_ENABLED: 'false'
      WORKSPACE_DEV_SEED_ENABLED: 'false'
      SUBSCRIPTION_WORKER_ENABLED: 'false'
      REGISTRATION_COOKIE_SECURE: 'false'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: question-bank@example.test
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      REGISTRATION_PUBLIC_BASE_URL: http://localhost:8098
    ports: ['127.0.0.1:28480:8080']
    volumes:
      - ./backend/target/question-bank-test.jar:/app/question-bank-test.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      mailpit:
        condition: service_started
volumes:
  question_bank_postgres:
  question_bank_graph:
