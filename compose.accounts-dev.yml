name: sep490-accounts-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: adapt_learn_graph_dev_accounts
      POSTGRES_USER: adapt_learn_graph
      POSTGRES_PASSWORD: ${DEV_ACCOUNTS_DB_PASSWORD:?Private dev settings required}
    ports: ['127.0.0.1:28132:5432']
    volumes: [accounts_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U adapt_learn_graph -d adapt_learn_graph_dev_accounts']
      interval: 5s
      timeout: 5s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${DEV_ACCOUNTS_NEO4J_PASSWORD:?Private dev settings required}
      NEO4J_server_memory_heap_initial__size: 64m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_server_jvm_additional: -XX:ActiveProcessorCount=2
    ports: ['127.0.0.1:28174:7474', '127.0.0.1:28187:7687']
    volumes: [accounts_neo4j:/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${DEV_LEARNING_MINIO_USER:?Private dev settings required}
      MINIO_ROOT_PASSWORD: ${DEV_LEARNING_MINIO_PASSWORD:?Private dev settings required}
    ports: ['127.0.0.1:28190:9000']
    volumes: [accounts_learning_assets:/data]
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ['127.0.0.1:28125:8025']
  api:
    image: adapt-learn-graph-backend:dev
    entrypoint: [java]
    command: ['-XX:ActiveProcessorCount=2', '-Xms64m', '-Xmx384m', '-jar', /app/dev-accounts.jar, '--registration.mail-worker.enabled=false', '--subscription.worker.enabled=false']
    environment:
      SPRING_PROFILES_ACTIVE: local,workspace-baseline
      SPRING_FLYWAY_ENABLED: 'true'
      DB_URL: jdbc:postgresql://postgres:5432/adapt_learn_graph_dev_accounts
      DB_USER: adapt_learn_graph
      DB_PASSWORD: ${DEV_ACCOUNTS_DB_PASSWORD:?Private dev settings required}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${DEV_ACCOUNTS_NEO4J_PASSWORD:?Private dev settings required}
      REGISTRATION_ENCRYPTION_KEY: ${DEV_ACCOUNTS_ENCRYPTION_KEY:?Private dev settings required}
      REGISTRATION_HMAC_KEY: ${DEV_ACCOUNTS_HMAC_KEY:?Private dev settings required}
      REGISTRATION_COOKIE_SECURE: 'false'
      REGISTRATION_MAIL_WORKER_ENABLED: 'false'
      SUBSCRIPTION_WORKER_ENABLED: 'false'
      SUBSCRIPTION_PUBLIC_URL: http://localhost:8088
      CATALOG_SEED_ENABLED: 'false'
      PATHWAY_INITIAL_ENABLED: ${PATHWAY_INITIAL_ENABLED:-true}
      PATHWAY_INITIAL_READINESS_VERSION: ${PATHWAY_INITIAL_READINESS_VERSION:-local-baseline-prerequisite-v1}
      PATHWAY_INITIAL_SEARCH_VERSION: ${PATHWAY_INITIAL_SEARCH_VERSION:-compose-v011-bounded-v1}
      PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_NODES: ${PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_NODES:-128}
      PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_EDGES: ${PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_EDGES:-256}
      PATHWAY_INITIAL_SEARCH_MAX_PROVIDERS: ${PATHWAY_INITIAL_SEARCH_MAX_PROVIDERS:-2048}
      PATHWAY_INITIAL_SEARCH_BATCH_SIZE: ${PATHWAY_INITIAL_SEARCH_BATCH_SIZE:-32}
      PATHWAY_INITIAL_SEARCH_MAX_STATES: ${PATHWAY_INITIAL_SEARCH_MAX_STATES:-250000}
      PATHWAY_INITIAL_WORKER_ENABLED: ${PATHWAY_INITIAL_WORKER_ENABLED:-true}
      PATHWAY_INITIAL_WORKER_VERSION: ${PATHWAY_INITIAL_WORKER_VERSION:-compose-worker-v1}
      PATHWAY_INITIAL_WORKER_LEASE_MS: ${PATHWAY_INITIAL_WORKER_LEASE_MS:-300000}
      PATHWAY_INITIAL_WORKER_MAX_ATTEMPTS: ${PATHWAY_INITIAL_WORKER_MAX_ATTEMPTS:-3}
      PATHWAY_INITIAL_WORKER_MINIMUM_BACKOFF_MS: ${PATHWAY_INITIAL_WORKER_MINIMUM_BACKOFF_MS:-2000}
      PATHWAY_INITIAL_WORKER_MAXIMUM_BACKOFF_MS: ${PATHWAY_INITIAL_WORKER_MAXIMUM_BACKOFF_MS:-30000}
      PATHWAY_INITIAL_WORKER_POLL_INTERVAL_MS: ${PATHWAY_INITIAL_WORKER_POLL_INTERVAL_MS:-2000}
      LEARNING_ASSETS_ENDPOINT: http://minio:9000
      LEARNING_ASSETS_ACCESS_KEY: ${DEV_LEARNING_MINIO_USER:?Private dev settings required}
      LEARNING_ASSETS_SECRET_KEY: ${DEV_LEARNING_MINIO_PASSWORD:?Private dev settings required}
      LEARNING_MAIL_ENABLED: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: learning@example.test
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
    volumes: ['./local/dev-accounts/app.jar:/app/dev-accounts.jar:ro']
    ports: ['127.0.0.1:28180:8080']
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_started
      mailpit:
        condition: service_started
volumes:
  accounts_postgres:
  accounts_neo4j:
  accounts_learning_assets:
