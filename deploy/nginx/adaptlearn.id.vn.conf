# /etc/nginx/sites-available/adaptlearn.id.vn
# Installed by .github/workflows/deploy.yml. Expects compose.deploy.yml to publish
# the web container (Caddy: SPA + /api proxy) on 127.0.0.1:8088 (WEB_PORT).
# Certificates: sudo certbot certonly --webroot -w /var/www/certbot -d adaptlearn.id.vn -d www.adaptlearn.id.vn

upstream adaptlearn_web {
    server 127.0.0.1:8088;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name adaptlearn.id.vn www.adaptlearn.id.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://adaptlearn.id.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name www.adaptlearn.id.vn;

    ssl_certificate /etc/letsencrypt/live/adaptlearn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaptlearn.id.vn/privkey.pem;

    return 301 https://adaptlearn.id.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name adaptlearn.id.vn;

    ssl_certificate /etc/letsencrypt/live/adaptlearn.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adaptlearn.id.vn/privkey.pem;

    # Learning content uploads (videos/documents) stream straight through.
    client_max_body_size 2g;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Includes the PayOS webhook: POST /api/v1/payments/payos/webhook
    location /api/ {
        proxy_pass http://adaptlearn_web;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://adaptlearn_web;
        proxy_read_timeout 60s;
    }
}
