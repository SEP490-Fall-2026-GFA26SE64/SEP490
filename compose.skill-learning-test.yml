# Disposable acceptance environment; no mounts/volumes from main-dev or accounts-dev.
name: sep490-skill-learning-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: question_bank_test
      POSTGRES_USER: skill_learning_test
      POSTGRES_PASSWORD: isolated-skill-learning-only
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skill_learning_test -d question_bank_test']
      interval: 3s
      timeout: 3s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/isolated-skill-learning-only
      NEO4J_server_memory_heap_initial__size: 64m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      NEO4J_server_jvm_additional: -XX:ActiveProcessorCount=2
  api:
    image: adapt-learn-graph-backend:dev
    entrypoint: [java]
    command: ['-XX:ActiveProcessorCount=2', '-Xms64m', '-Xmx384m', '-Dloader.main=com.adaptlearngraph.config.SkillLearningTestRuntime', '-cp', '/app/skill-learning-test.jar', 'org.springframework.boot.loader.launch.PropertiesLauncher']
    environment:
      ISOLATED_SKILL_LEARNING_TEST: 'true'
      SPRING_PROFILES_ACTIVE: local,workspace-baseline
      WORKSPACE_MIGRATION_LOCATION: classpath:db/workspace-migration
      SPRING_FLYWAY_ENABLED: 'true'
      DB_URL: jdbc:postgresql://postgres:5432/question_bank_test
      DB_USER: skill_learning_test
      DB_PASSWORD: isolated-skill-learning-only
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: isolated-skill-learning-only
      CATALOG_SEED_ENABLED: 'false'
      CATALOG_LOCAL_ACTOR_ENABLED: 'false'
      WORKSPACE_DEV_SEED_ENABLED: 'false'
      PATHWAY_INITIAL_ENABLED: 'false'
      SUBSCRIPTION_WORKER_ENABLED: 'false'
      REGISTRATION_MAIL_WORKER_ENABLED: 'false'
      REGISTRATION_COOKIE_SECURE: 'false'
      MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
      REGISTRATION_ENCRYPTION_KEY: ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU=
      REGISTRATION_HMAC_KEY: aGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGg=
    ports: ['127.0.0.1:28680:8080']
    volumes: ['./backend/target/skill-learning-test.jar:/app/skill-learning-test.jar:ro']
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
  web:
    image: caddy:2-alpine
    ports: ['127.0.0.1:8106:80']
    volumes:
      - ./frontend/dist:/srv:ro
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [api]
