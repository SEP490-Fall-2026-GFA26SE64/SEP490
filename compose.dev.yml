name: adapt-learn-graph-dev

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
x-backend-environment: &backend-environment
  DB_URL: jdbc:postgresql://postgres:5432/adapt_learn_graph
  DB_USER: adapt_learn_graph
  DB_PASSWORD: ${DB_PASSWORD:-local-only-postgres}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-only-neo4j}
  TARGET_SELECTION_LOCAL_ASSESSMENT_IN_PROGRESS: ${TARGET_SELECTION_LOCAL_ASSESSMENT_IN_PROGRESS:-false}
  # Main startup never restores retired graph/bank/model seeds or fixed authoring.
  CATALOG_SEED_ENABLED: "false"
  ASSESSMENT_BASELINE_LEGACYAUTHORING_ENABLED: "false"
  BASELINE_ANSWER_REVIEW_ENABLED: "false"
  ASSESSMENT_BASELINE_IRTADMINISTRATION_ENABLED: "false"

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: adapt_learn_graph
      POSTGRES_USER: adapt_learn_graph
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapt_learn_graph -d adapt_learn_graph"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    entrypoint: ["tini", "-g", "--", "/bin/bash", "/catalog-bootstrap/start-catalog.sh"]
    stop_grace_period: 120s
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-only-neo4j}
      # Bootstrap imports writable once, then gracefully restarts sealed read-only.
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      # The pre-cutover neo4j_data volume remains intact; never down -v to upgrade.
      - neo4j_catalog_v011_data:/data
      - catalog_v011_bootstrap:/catalog-state
      - ./docker/dev/start-catalog.sh:/catalog-bootstrap/start-catalog.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s

  migrate:
    image: adapt-learn-graph-backend:dev
    build: *backend-build
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local,migrate
      # Schema first; the separate local seed service initializes missing catalog/bank data.
      CATALOG_SEED_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"

  seed:
    image: adapt-learn-graph-backend:dev
    build: *backend-build
    entrypoint: ["/bin/sh", "-ec", "java -jar /app/app.jar; touch /catalog-state/imported-v011"]
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local,local-demo-seed
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ASSESSMENT_BASELINE_LOCALDEMO_SEEDENABLED: "true"
    volumes:
      - ./documents/dataset/import/ontology_seed-v011.json:/seed/ontology_seed.json:ro
      - ./documents/dataset/question-bank/15-1212.00/catalog-scope-v09.json:/seed/catalog-scope.json:ro
      - catalog_v011_bootstrap:/catalog-state
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  catalog-ready:
    image: neo4j:5.26-community
    entrypoint: ["/bin/bash", "/catalog-bootstrap/wait-catalog.sh"]
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-only-neo4j}
    volumes:
      - catalog_v011_bootstrap:/catalog-state:ro
      - ./docker/dev/wait-catalog.sh:/catalog-bootstrap/wait-catalog.sh:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: adapt-learn-graph-backend:dev
    build: *backend-build
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local,local-baseline-demo
      ASSESSMENT_BASELINE_LOCALDEMO_ENABLED: "true"
      PATHWAY_LOCAL_AUTH_BYPASS_ENABLED: ${PATHWAY_LOCAL_AUTH_BYPASS_ENABLED:-true}
      PATHWAY_LOCAL_AUTH_BYPASS_EXPERT_ACCOUNT_ID: ${PATHWAY_LOCAL_AUTH_BYPASS_EXPERT_ACCOUNT_ID:-f0fe3f90-3b39-31ee-b748-9533d1ef22b2}
      PATHWAY_INITIAL_ENABLED: ${PATHWAY_INITIAL_ENABLED:-true}
      PATHWAY_INITIAL_CATALOG_ALLOW_REVIEW_SEED: ${PATHWAY_INITIAL_CATALOG_ALLOW_REVIEW_SEED:-true}
      PATHWAY_INITIAL_CATALOG_MAX_REQUIREMENT_ROWS: "1891"
      PATHWAY_INITIAL_LOCAL_ASSIGNMENT_ENABLED: ${PATHWAY_INITIAL_LOCAL_ASSIGNMENT_ENABLED:-true}
      PATHWAY_INITIAL_LOCAL_ASSIGNMENT_PROVISION_EXPERT_ENABLED: ${PATHWAY_INITIAL_LOCAL_ASSIGNMENT_PROVISION_EXPERT_ENABLED:-true}
      PATHWAY_INITIAL_LOCAL_ASSIGNMENT_ROLE_IDS: ${PATHWAY_INITIAL_LOCAL_ASSIGNMENT_ROLE_IDS:-}
      PATHWAY_INITIAL_LOCAL_ASSIGNMENT_MAX_PATHWAYS: ${PATHWAY_INITIAL_LOCAL_ASSIGNMENT_MAX_PATHWAYS:-5000}
      PATHWAY_INITIAL_LOCAL_PLANNING_ENABLED: ${PATHWAY_INITIAL_LOCAL_PLANNING_ENABLED:-true}
      PATHWAY_INITIAL_READINESS_VERSION: ${PATHWAY_INITIAL_READINESS_VERSION:-local-baseline-prerequisite-v1}
      PATHWAY_INITIAL_SEARCH_VERSION: ${PATHWAY_INITIAL_SEARCH_VERSION:-compose-v011-bounded-v1}
      PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_NODES: ${PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_NODES:-128}
      PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_EDGES: ${PATHWAY_INITIAL_SEARCH_MAX_CLOSURE_EDGES:-256}
      PATHWAY_INITIAL_SEARCH_MAX_PROVIDERS: ${PATHWAY_INITIAL_SEARCH_MAX_PROVIDERS:-2048}
      PATHWAY_INITIAL_SEARCH_BATCH_SIZE: ${PATHWAY_INITIAL_SEARCH_BATCH_SIZE:-32}
      PATHWAY_INITIAL_SEARCH_MAX_STATES: ${PATHWAY_INITIAL_SEARCH_MAX_STATES:-250000}
      PATHWAY_INITIAL_WORKER_ENABLED: ${PATHWAY_INITIAL_WORKER_ENABLED:-true}
      PATHWAY_INITIAL_WORKER_VERSION: ${PATHWAY_INITIAL_WORKER_VERSION:-compose-worker-v1}
      PATHWAY_INITIAL_WORKER_LEASE_MS: ${PATHWAY_INITIAL_WORKER_LEASE_MS:-300000}
      PATHWAY_INITIAL_WORKER_MAX_ATTEMPTS: ${PATHWAY_INITIAL_WORKER_MAX_ATTEMPTS:-3}
      PATHWAY_INITIAL_WORKER_MINIMUM_BACKOFF_MS: ${PATHWAY_INITIAL_WORKER_MINIMUM_BACKOFF_MS:-2000}
      PATHWAY_INITIAL_WORKER_MAXIMUM_BACKOFF_MS: ${PATHWAY_INITIAL_WORKER_MAXIMUM_BACKOFF_MS:-30000}
      PATHWAY_INITIAL_WORKER_POLL_INTERVAL_MS: ${PATHWAY_INITIAL_WORKER_POLL_INTERVAL_MS:-2000}
    volumes:
      - ./documents/dataset/import/ontology_seed-v011.json:/seed/ontology_seed.json:ro
      - ./documents/dataset/import/ontology_seed-v010.json:/seed/baseline-history-v010.json:ro
      - ./documents/dataset/question-bank/15-1212.00/historical/ontology_seed-v08.json:/seed/baseline-history-v08.json:ro
      - ./documents/dataset/question-bank/15-1212.00/historical/question-bank-v1.json:/seed/baseline-bank-v08.json:ro
    depends_on:
      catalog-ready:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://api:8080
      # Docker Desktop Windows bind mounts can miss filesystem change events.
      DEV_WATCH_POLLING: "true"
      VITE_LOCAL_BASELINE_DEMO_ENABLED: "true"
      # Visibility gates only; these grant no backend identity, publication or model readiness.
      VITE_ADAPTIVE_BASELINE_ENABLED: ${VITE_ADAPTIVE_BASELINE_ENABLED:-true}
      VITE_EMPLOYEE_ADAPTIVE_BASELINE_ENABLED: ${VITE_EMPLOYEE_ADAPTIVE_BASELINE_ENABLED:-true}
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:5173"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_catalog_v010_data:
  neo4j_catalog_v011_data:
  catalog_v011_bootstrap:
