<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>PostgreSQL r3 - shared engine, two policies and separate evidence</title><rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="29" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#0F172A">PostgreSQL r3 - shared engine, two policies and separate evidence</text>
<text x="29" y="69" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">Principal keys/fields only. All workflow rows use trusted tenant/learner scope and current authorization.</text>
