<text x="676" y="995" font-size="17" font-weight="400" fill="#0f172a">One global PROCESSING claim</text>
<text x="676" y="1020" font-size="17" font-weight="400" fill="#0f172a">Run / status / deadline completion fence</text>
<text x="676" y="1045" font-size="17" font-weight="400" fill="#0f172a">Validate IDs, ranks and explanations</text>
<text x="676" y="1070" font-size="17" font-weight="400" fill="#0f172a">Copy original numeric score evidence</text>
<text x="676" y="1095" font-size="17" font-weight="400" fill="#0f172a">Persist success or explicit failure</text>
