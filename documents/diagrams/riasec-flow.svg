<text x="66" y="951" font-size="21" font-weight="650" fill="#0f172a">RiasecCatalog</text>
<text x="66" y="995" font-size="17" font-weight="400" fill="#0f172a">Read current catalog at claim / retry</text>
<text x="66" y="1020" font-size="17" font-weight="400" fill="#0f172a">ACTIVE + trusted same organization</text>
<text x="66" y="1045" font-size="17" font-weight="400" fill="#0f172a">ID + complete native integers 0–40</text>
<text x="66" y="1070" font-size="17" font-weight="400" fill="#0f172a">No Department or nonzero-norm filter</text>
<text x="66" y="1095" font-size="17" font-weight="400" fill="#0f172a">No candidates → successful empty list</text>
<rect x="660" y="920" width="470" height="189" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="660" y="920" width="470" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
