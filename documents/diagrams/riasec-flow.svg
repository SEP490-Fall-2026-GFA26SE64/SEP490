<text x="676" y="535" font-size="17" font-weight="400" fill="#0f172a">riasec_workspace / riasec_result</text>
<text x="676" y="560" font-size="17" font-weight="400" fill="#0f172a">Saved answers/scores before AI</text>
<text x="676" y="585" font-size="17" font-weight="400" fill="#0f172a">AI status, run UUID and deadline</text>
<text x="676" y="610" font-size="17" font-weight="400" fill="#0f172a">Model/prompt, recommendation snapshots</text>
<text x="676" y="635" font-size="17" font-weight="400" fill="#0f172a">Inactive timestamp and seven-day retention</text>
