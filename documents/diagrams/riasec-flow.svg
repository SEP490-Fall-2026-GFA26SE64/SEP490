<text x="66" y="215" font-size="17" font-weight="400" fill="#0f172a">60 local EN/VI activities; responses 0–4</text>
<text x="66" y="240" font-size="17" font-weight="400" fill="#0f172a">Autosave / takeover / review / confirmed submit</text>
<text x="66" y="265" font-size="17" font-weight="400" fill="#0f172a">Raw 0–40 radar; filtered result history</text>
