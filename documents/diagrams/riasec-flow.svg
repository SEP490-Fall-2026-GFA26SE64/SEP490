<text x="1256" y="995" font-size="17" font-weight="400" fill="#0f172a">qwen3:4b-instruct-2507-q4_K_M</text>
<text x="1256" y="1020" font-size="13.796296296296296" font-weight="400" fill="#0f172a">Only scores + position profiles/metadata</text>
<text x="1256" y="1045" font-size="16.230936819172115" font-weight="400" fill="#0f172a">0–3 supplied IDs; dense ranks/ties</text>
<text x="1256" y="1070" font-size="16.230936819172115" font-weight="400" fill="#0f172a">English interest-only explanations</text>
<text x="1256" y="1095" font-size="14.150047483380815" font-weight="400" fill="#0f172a">No Role, Skill or learner-history input</text>
