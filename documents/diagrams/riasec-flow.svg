<text x="676" y="215" font-size="17" font-weight="400" fill="#0f172a">Session/CSRF; trusted organization/account</text>
<text x="676" y="240" font-size="17" font-weight="400" fill="#0f172a">Owner lock, revision/editor checks and stable draft UUID receipt</text>
<text x="676" y="265" font-size="17" font-weight="400" fill="#0f172a">Score saved answers; queue AI; current/history/retention commands</text>
