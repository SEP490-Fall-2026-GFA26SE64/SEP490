<text x="66" y="1240" font-size="19" font-weight="650" fill="#9a3412">Durable state and limits</text>
<text x="66" y="1271" font-size="16" font-weight="400" fill="#0f172a">QUEUED → PROCESSING → SUCCEEDED / FAILED; expiry can fail queued or processing work.</text>
<text x="66" y="1296" font-size="16" font-weight="400" fill="#0f172a">Queue 20min / processing 8min / HTTP 7min; worker every 2sec, maintenance every 15sec.</text>
<text x="66" y="1321" font-size="16" font-weight="400" fill="#0f172a">Only current active FAILED AI can retry. Success including zero suggestions is final; restore does not rerun AI.</text>
<text x="66" y="1346" font-size="16" font-weight="400" fill="#0f172a">No cosine fallback, chat, automatic Role choice or mastery/pathway writes. Scores survive AI failure.</text>
