<text x="66" y="535" font-size="14.689265536723163" font-weight="400" fill="#0f172a">Metadata + six optional all-or-none integer 0–40 properties</text>
<text x="66" y="560" font-size="17" font-weight="400" fill="#0f172a">No personal results or learning history</text>
<text x="66" y="585" font-size="16.352201257861633" font-weight="400" fill="#0f172a">Interest edits preserve learning-catalog fingerprints</text>
