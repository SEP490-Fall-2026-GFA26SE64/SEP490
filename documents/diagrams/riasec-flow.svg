<text x="50" y="45" font-size="26" font-weight="650" fill="#0f172a">RIASEC runtime — durable scoring and asynchronous AI</text>
<text x="50" y="78" font-size="16" font-weight="400" fill="#475569">Local + workspace-baseline + riasec.enabled; demo/prod excluded. All personal commands use trusted Employee scope.</text>
