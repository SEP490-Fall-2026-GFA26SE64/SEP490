<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1320" viewBox="0 0 1630 1320" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="50" y="45" font-size="26" font-weight="650" fill="#0f172a">RIASEC storage — PostgreSQL V74 and Neo4j ownership</text>
<text x="50" y="78" font-size="16" font-weight="400" fill="#475569">Source-defined tables and application rules at 2c2468b5; no fresh runtime schema capture.</text>
<rect x="50" y="130" width="570" height="239" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="130" width="570" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="161" font-size="21" font-weight="650" fill="#0f172a">platform.riasec_workspace</text>
<text x="66" y="205" font-size="17" font-weight="400" fill="#0f172a">organization_id: UUID [PK]</text>
<text x="66" y="230" font-size="17" font-weight="400" fill="#0f172a">account_id: UUID [PK, FK account]</text>
<text x="66" y="255" font-size="17" font-weight="400" fill="#0f172a">draft_id: UUID [nullable]</text>
<text x="66" y="280" font-size="17" font-weight="400" fill="#0f172a">answers: JSONB [required; default {}]</text>
<text x="66" y="305" font-size="17" font-weight="400" fill="#0f172a">revision: BIGINT [required; default 0]</text>
<text x="66" y="330" font-size="17" font-weight="400" fill="#0f172a">editor_id: UUID [nullable]</text>
<text x="66" y="355" font-size="17" font-weight="400" fill="#0f172a">updated_at: TIMESTAMPTZ [required]</text>
<rect x="790" y="130" width="780" height="464" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="790" y="130" width="780" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="806" y="161" font-size="21" font-weight="650" fill="#0f172a">platform.riasec_result</text>
<text x="806" y="205" font-size="17" font-weight="400" fill="#0f172a">result_id: UUID [PK; submitted draft UUID]</text>
<text x="806" y="230" font-size="17" font-weight="400" fill="#0f172a">organization_id: UUID [FK owner pair]</text>
<text x="806" y="255" font-size="17" font-weight="400" fill="#0f172a">account_id: UUID [FK owner pair]</text>
<text x="806" y="280" font-size="17" font-weight="400" fill="#0f172a">answers: JSONB [required]</text>
<text x="806" y="305" font-size="17" font-weight="400" fill="#0f172a">scores: JSONB [required; six raw 0..40]</text>
<text x="806" y="330" font-size="17" font-weight="400" fill="#0f172a">instrument_version: TEXT [required]</text>
<text x="806" y="355" font-size="17" font-weight="400" fill="#0f172a">scoring_version: TEXT [required]</text>
<text x="806" y="380" font-size="17" font-weight="400" fill="#0f172a">submitted_at: TIMESTAMPTZ [required]</text>
<text x="806" y="405" font-size="17" font-weight="400" fill="#0f172a">deleted_at: TIMESTAMPTZ [nullable]</text>
<text x="806" y="430" font-size="17" font-weight="400" fill="#0f172a">ai_status: TEXT [required; four-state check]</text>
<text x="806" y="455" font-size="17" font-weight="400" fill="#0f172a">ai_deadline: TIMESTAMPTZ [required]</text>
<text x="806" y="480" font-size="17" font-weight="400" fill="#0f172a">run_id: UUID [required; completion fence]</text>
<text x="806" y="505" font-size="17" font-weight="400" fill="#0f172a">model: TEXT [nullable]</text>
<text x="806" y="530" font-size="17" font-weight="400" fill="#0f172a">prompt_version: TEXT [nullable]</text>
<text x="806" y="555" font-size="17" font-weight="400" fill="#0f172a">recommendations: JSONB [nullable]</text>
<text x="806" y="580" font-size="17" font-weight="400" fill="#0f172a">failure_code: TEXT [nullable]</text>
<rect x="50" y="490" width="570" height="89" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="490" width="570" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="521" font-size="21" font-weight="650" fill="#0f172a">platform.account [reference stub]</text>
<text x="66" y="565" font-size="17" font-weight="400" fill="#0f172a">account_id: UUID [PK; reference stub]</text>
<rect x="50" y="770" width="570" height="289" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="770" width="570" height="48" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="66" y="801" font-size="21" font-weight="650" fill="#0f172a">Neo4j :JobPosition</text>
<text x="66" y="845" font-size="17" font-weight="400" fill="#0f172a">id: String</text>
<text x="66" y="870" font-size="17" font-weight="400" fill="#0f172a">organizationId: String</text>
<text x="66" y="895" font-size="17" font-weight="400" fill="#0f172a">code / name / description / status</text>
<text x="66" y="920" font-size="17" font-weight="400" fill="#0f172a">interestRealistic: Integer [0..40, optional]</text>
<text x="66" y="945" font-size="17" font-weight="400" fill="#0f172a">interestInvestigative: Integer [0..40, optional]</text>
<text x="66" y="970" font-size="17" font-weight="400" fill="#0f172a">interestArtistic: Integer [0..40, optional]</text>
<text x="66" y="995" font-size="17" font-weight="400" fill="#0f172a">interestSocial: Integer [0..40, optional]</text>
<text x="66" y="1020" font-size="17" font-weight="400" fill="#0f172a">interestEnterprising: Integer [0..40, optional]</text>
<text x="66" y="1045" font-size="17" font-weight="400" fill="#0f172a">interestConventional: Integer [0..40, optional]</text>
<polyline points="790,280 620,280" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="635" y="260" font-size="15" font-weight="600" fill="#334155">owner pair FK</text>
<polyline points="335,369 335,490" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="350" y="450" font-size="15" font-weight="600" fill="#334155">account_id FK</text>
<rect x="790" y="770" width="780" height="187" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="806" y="800" font-size="19" font-weight="650" fill="#9a3412">recommendations JSON snapshot</text>
<text x="806" y="831" font-size="16" font-weight="400" fill="#0f172a">position: id, code, name, description, six original scores</text>
<text x="806" y="856" font-size="16" font-weight="400" fill="#0f172a">rank: dense 1–3; ties allowed; at most three positions</text>
<text x="806" y="881" font-size="16" font-weight="400" fill="#0f172a">explanation: English interest comparison</text>
<text x="806" y="906" font-size="16" font-weight="400" fill="#0f172a">comparisons: two dimensions + original Employee/position scores</text>
<text x="806" y="931" font-size="16" font-weight="400" fill="#0f172a">Saved snapshot is not an editable SQL Job Position catalog.</text>
<polyline points="1180,594 1180,770" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1190" y="705" font-size="15" font-weight="600" fill="#334155">recommendations</text>
<polyline points="620,930 790,930" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="645" y="915" font-size="15" font-weight="600" fill="#334155">copied, NOT FK</text>
<rect x="50" y="1130" width="740" height="162" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="66" y="1160" font-size="19" font-weight="650" fill="#9a3412">Application semantics</text>
<text x="66" y="1191" font-size="16" font-weight="400" fill="#0f172a">One owner row; at most one non-expiring draft.</text>
<text x="66" y="1216" font-size="16" font-weight="400" fill="#0f172a">Draft UUID becomes result receipt at submit.</text>
<text x="66" y="1241" font-size="16" font-weight="400" fill="#0f172a">Current = newest active submitted_at/result_id.</text>
<text x="66" y="1266" font-size="16" font-weight="400" fill="#0f172a">Inactive: recover within 7 days or permanently delete.</text>
<rect x="830" y="1130" width="740" height="162" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="846" y="1160" font-size="19" font-weight="650" fill="#9a3412">DDL and boundary</text>
<text x="846" y="1191" font-size="16" font-weight="400" fill="#0f172a">FK pair: (organization_id, account_id) → workspace.</text>
<text x="846" y="1216" font-size="16" font-weight="400" fill="#0f172a">No organization FK or cross-store FK is invented.</text>
<text x="846" y="1241" font-size="16" font-weight="400" fill="#0f172a">JSON object checks: workspace answers; result answers/scores.</text>
<text x="846" y="1266" font-size="16" font-weight="400" fill="#0f172a">Indexes: owner ordering, queued/processing, deleted_at.</text>
</svg>
