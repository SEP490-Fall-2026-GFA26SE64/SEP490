<text x="501" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Member Level is not knowledgeLevel</text>
<text x="501" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">REQUIRES_SKILL: explicit level list</text>
