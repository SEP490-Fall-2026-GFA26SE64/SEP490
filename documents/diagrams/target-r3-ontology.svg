<text x="961" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Existing grouping and metadata</text>
<text x="961" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No independent numeric mastery</text>
<rect x="490" y="410" width="365" height="230" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="491" y="411" width="363" height="38" fill="#FFF5EB"/>
