<text x="41" y="198" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Existing IDs / ownership / review</text>
<text x="41" y="221" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Role owns its member Levels</text>
<rect x="490" y="110" width="365" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="491" y="111" width="363" height="38" fill="#FFF5EB"/>
