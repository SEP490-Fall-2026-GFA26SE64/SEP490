<text x="961" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">id / org / version / lifecycle</text>
<text x="961" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">knowledgeLevel / outcomeCodes</text>
<text x="961" y="521" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">name / description / referenceUrl</text>
<text x="961" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">HTTPS reference URL required</text>
<text x="961" y="567" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">One assigned per certificate-only level</text>
<text x="961" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Definition, not Employee evidence</text>
<rect x="490" y="760" width="550" height="130" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="491" y="761" width="548" height="38" fill="#FFF5EB"/>
<text x="501" y="787" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">Relationship properties (annotation)</text>
<text x="501" y="825" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">REQUIRES_SKILL.requiredKnowledgeLevels replaces score</text>
<text x="501" y="848" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">HAS_SKILL_PREREQUISITE: dependent/prerequisite levels</text>
<text x="501" y="871" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No implicit inheritance or speculative baseline closure</text>
