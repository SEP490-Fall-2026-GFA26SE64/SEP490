<text x="501" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Existing identity / tenant / review</text>
<text x="501" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">moduleOnlyKnowledgeLevels [list]</text>
<text x="501" y="521" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">certificateOnlyKnowledgeLevels [list]</text>
<text x="501" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Disjoint modes for each skill-level</text>
<text x="501" y="567" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">foundation/intermediate/advanced</text>
<text x="501" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">OutcomeCodes [native scalar lists]</text>
<text x="501" y="613" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No extra requirement node</text>
<rect x="30" y="410" width="365" height="230" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="31" y="411" width="363" height="38" fill="#FFF5EB"/>
<text x="41" y="437" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">LearningModule</text>
<text x="41" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Existing content / version / metadata</text>
<text x="41" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">knowledgeLevel: one fixed enum value</text>
<text x="41" y="521" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">outcomeCodes: exact coverage</text>
<text x="41" y="544" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">TEACHES exactly one MicroSkill</text>
<text x="41" y="567" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Multiple equivalent alternatives</text>
<text x="41" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No teachingFocus / difficultyLevel</text>
<text x="41" y="613" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No level copy on TEACHES</text>
<rect x="950" y="410" width="365" height="230" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="951" y="411" width="363" height="38" fill="#EAF5EF"/>
