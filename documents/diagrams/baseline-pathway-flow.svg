<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="2050" viewBox="0 0 2350 2050" font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="50" y="45" font-size="28" font-weight="650" fill="#0f172a">Baseline → pathway → Skill Assessment → recalculation</text>
<text x="50" y="80" font-size="17" font-weight="400" fill="#475569">Current source 2026-11-23. Source wiring is not runtime or production acceptance.</text>
<rect x="50" y="140" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="140" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="65" y="171" font-size="21" font-weight="650" fill="#0f172a">1  Scoped configuration</text>
<text x="65" y="216" font-size="17" font-weight="400" fill="#0f172a">L&amp;D: one Baseline configuration per Role</text>
<text x="65" y="242" font-size="17" font-weight="400" fill="#0f172a">Expert: common Skill settings for assigned Roles</text>
<text x="65" y="268" font-size="17" font-weight="400" fill="#0f172a">Draft / immutable version / active pointer</text>
<text x="65" y="294" font-size="17" font-weight="400" fill="#0f172a">Quota, passing threshold, timer, wait and max attempts</text>
<rect x="800" y="140" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="800" y="140" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="815" y="171" font-size="21" font-weight="650" fill="#0f172a">2  Selected Role baseline</text>
<text x="815" y="216" font-size="17" font-weight="400" fill="#0f172a">Required Skill levels and lower; includes certificate mode</text>
<text x="815" y="242" font-size="17" font-weight="400" fill="#0f172a">Subtract compatible official evidence; no speculative closure</text>
<text x="815" y="268" font-size="17" font-weight="400" fill="#0f172a">Freeze TARGET paper, deadline, answers and results</text>
<text x="815" y="294" font-size="17" font-weight="400" fill="#0f172a">Baseline is diagnostic; it does not award official achievement</text>
<rect x="1550" y="140" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="1550" y="140" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="1565" y="171" font-size="21" font-weight="650" fill="#0f172a">3  Confirm request + generation</text>
<text x="1565" y="216" font-size="17" font-weight="400" fill="#0f172a">Expected selection / revision / planning hash</text>
<text x="1565" y="242" font-size="17" font-weight="400" fill="#0f172a">Bind Role AND Level; freeze accepted input</text>
<text x="1565" y="268" font-size="17" font-weight="400" fill="#0f172a">Leased generation: all valid module alternatives or certificate</text>
<text x="1565" y="294" font-size="17" font-weight="400" fill="#0f172a">No work → NO_LEARNING_REQUIRED; missing provision explicit</text>
<rect x="1550" y="690" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="1550" y="690" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="1565" y="721" font-size="21" font-weight="650" fill="#0f172a">4  Assigned Expert review</text>
<text x="1565" y="766" font-size="17" font-weight="400" fill="#0f172a">Reduce unstarted options; protect started choices</text>
<text x="1565" y="792" font-size="17" font-weight="400" fill="#0f172a">Check / reasoned reject / exact revision-hash approval</text>
<text x="1565" y="818" font-size="17" font-weight="400" fill="#0f172a">First approval pins UTC calendar-month duration/deadline</text>
<text x="1565" y="844" font-size="17" font-weight="400" fill="#0f172a">Repair missing provision; check exact approval readiness</text>
<rect x="800" y="690" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="800" y="690" width="650" height="48" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="815" y="721" font-size="21" font-weight="650" fill="#0f172a">5  Accepted learning context</text>
<text x="815" y="766" font-size="17" font-weight="400" fill="#0f172a">Exact approved module revision / content and real progress</text>
<text x="815" y="792" font-size="17" font-weight="400" fill="#0f172a">Completion/pin provenance is not official achievement</text>
<text x="815" y="818" font-size="17" font-weight="400" fill="#0f172a">Separate certificate submission + assigned evidence decision</text>
<text x="815" y="844" font-size="17" font-weight="400" fill="#0f172a">Started content may remain readable; fresh exams retain guards</text>
<rect x="50" y="690" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="690" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="65" y="721" font-size="21" font-weight="650" fill="#0f172a">6  Skill Assessment</text>
<text x="65" y="766" font-size="17" font-weight="400" fill="#0f172a">MAIN + all configured prerequisite groups</text>
<text x="65" y="792" font-size="17" font-weight="400" fill="#0f172a">Exact mandatory quota + ordinary pool; no duplicates</text>
<text x="65" y="818" font-size="17" font-weight="400" fill="#0f172a">Skill/version allowance and wait shared across Roles</text>
<text x="65" y="844" font-size="17" font-weight="400" fill="#0f172a">Retake = full new paper; score frozen before outcome work</text>
<rect x="50" y="1270" width="650" height="196" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="50" y="1270" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="65" y="1301" font-size="21" font-weight="650" fill="#0f172a">7  Durable outcome processing</text>
<text x="65" y="1346" font-size="17" font-weight="400" fill="#0f172a">Actual failed nonofficial prerequisites drive supplementation</text>
<text x="65" y="1372" font-size="17" font-weight="400" fill="#0f172a">Recalculate plan before evaluating readiness</text>
<text x="65" y="1398" font-size="17" font-weight="400" fill="#0f172a">MAIN_FAILED / VETO / WAITING_SUPPLEMENT / READY</text>
<text x="65" y="1424" font-size="17" font-weight="400" fill="#0f172a">Retain main pass, actual learning needs and prior achievement</text>
<text x="65" y="1450" font-size="17" font-weight="400" fill="#0f172a">Official prerequisite failure → NEED_REVIEW, no revocation</text>
<rect x="800" y="1270" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="800" y="1270" width="650" height="48" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/>
<text x="815" y="1301" font-size="21" font-weight="650" fill="#0f172a">8  Genuine evidence + reconcile</text>
<text x="815" y="1346" font-size="17" font-weight="400" fill="#0f172a">When READY, insert exact module evidence once</text>
<text x="815" y="1372" font-size="17" font-weight="400" fill="#0f172a">Recalculate again within the same learner transaction</text>
<text x="815" y="1398" font-size="17" font-weight="400" fill="#0f172a">Certificate approval uses genuine evidence + same revision owner</text>
<text x="815" y="1424" font-size="17" font-weight="400" fill="#0f172a">Source-event receipts / immutable versions / current-pointer CAS</text>
<rect x="1550" y="1270" width="650" height="170" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="1550" y="1270" width="650" height="48" rx="8" fill="#e0e7ff" stroke="#64748b" stroke-width="1.5"/>
<text x="1565" y="1301" font-size="21" font-weight="650" fill="#0f172a">9  Provision / evidence refresh</text>
<text x="1565" y="1346" font-size="17" font-weight="400" fill="#0f172a">Preserve completed steps, progress and Expert exclusions</text>
<text x="1565" y="1372" font-size="17" font-weight="400" fill="#0f172a">Retain still-valid original approval basis</text>
<text x="1565" y="1398" font-size="17" font-weight="400" fill="#0f172a">Invalid basis → review; missing provision → Expert action</text>
<text x="1565" y="1424" font-size="17" font-weight="400" fill="#0f172a">Carried bypass supplements stay parallel and non-gating</text>
<polyline points="700,235 800,235" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="715" y="217" font-size="15" font-weight="600" fill="#334155">policy</text>
<polyline points="1450,235 1550,235" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1460" y="217" font-size="15" font-weight="600" fill="#334155">confirm</text>
<polyline points="1875,310 1875,690" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1890" y="510" font-size="15" font-weight="600" fill="#334155">proposal</text>
<polyline points="1550,790 1450,790" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1460" y="773" font-size="15" font-weight="600" fill="#334155">accepted</text>
<polyline points="800,790 700,790" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="711" y="773" font-size="15" font-weight="600" fill="#334155">complete</text>
<polyline points="375,860 375,1270" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="390" y="1080" font-size="15" font-weight="600" fill="#334155">frozen score + job</text>
<polyline points="700,1380 800,1380" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="712" y="1363" font-size="15" font-weight="600" fill="#334155">READY</text>
<polyline points="1450,1380 1550,1380" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1462" y="1363" font-size="15" font-weight="600" fill="#334155">history</text>
<polyline points="1875,1270 1875,1120 1125,1120 1125,860" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="1280" y="1104" font-size="15" font-weight="600" fill="#334155">refresh accepted plan</text>
<polyline points="2200,1380 2280,1380 2280,790 2200,790" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="7 6"/>
<text x="2210" y="1070" font-size="15" font-weight="600" fill="#334155">review</text>
<rect x="50" y="1740" width="2250" height="187" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="65" y="1770" font-size="20" font-weight="650" fill="#9a3412">Ownership, timing and delivery limits</text>
<text x="65" y="1801" font-size="17" font-weight="400" fill="#0f172a">PostgreSQL owns drafts / attempts / evidence / requests / revisions / jobs / receipts / timing / notifications; Neo4j remains catalog-only.</text>
<text x="65" y="1826" font-size="17" font-weight="400" fill="#0f172a">Learner/request locks and expected versions protect accepted writes. PG + Neo4j access is not one distributed transaction.</text>
<text x="65" y="1851" font-size="17" font-weight="400" fill="#0f172a">Required completion uses actual evidence/bypass times; optional/parallel work does not hold target release. Later revisions do not reset the clock.</text>
<text x="65" y="1876" font-size="17" font-weight="400" fill="#0f172a">Transactional in-app decisions and actual added-provision notifications are deduplicated; no added provision means no recalculation-addition toast.</text>
<text x="65" y="1901" font-size="17" font-weight="400" fill="#0f172a">Local profiles/properties and worker gates must be enabled in the environment. No runtime, DB, inference or executable tests were run for these diagrams.</text>
</svg>
