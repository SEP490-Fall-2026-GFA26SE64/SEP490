<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1040" viewBox="0 0 1470 1040" role="img">
<title>Flow r3 - assess the selected target, discover prerequisite needs later</title><rect width="100%" height="100%" fill="#F8FAFC"/>
<text x="29" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#0F172A">Flow r3 - assess the selected target, discover prerequisite needs later</text>
<text x="29" y="69" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">Business data flow and key state distinctions; diagram is a target contract, not runtime proof.</text>
<polyline points="450,190 525,190" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="525,190 515,186 515,194" fill="#0F172A"/>
<polyline points="945,190 1020,190" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="1020,190 1010,186 1010,194" fill="#0F172A"/>
<polyline points="1230,270 1230,430" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="1230,430 1234,420 1226,420" fill="#0F172A"/>
<polyline points="1020,505 945,505" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="945,505 955,509 955,501" fill="#0F172A"/>
<polyline points="525,505 450,505" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="450,505 460,509 460,501" fill="#0F172A"/>
<polyline points="240,585 240,760" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="240,760 244,750 236,750" fill="#0F172A"/>
<polyline points="450,835 750,835" fill="none" stroke="#64748B" stroke-width="1.8"/>
<polygon points="750,835 740,831 740,839" fill="#0F172A"/>
<rect x="30" y="115" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="31" y="116" width="418" height="38" fill="#EEF2F6"/>
<text x="41" y="142" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">1. Select Role + member Level</text>
<text x="41" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Read explicit requiredKnowledgeLevels</text>
<text x="41" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Reuse exact official evidence only</text>
<text x="41" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Resolve MODULE_ONLY / CERTIFICATE_ONLY</text>
<rect x="525" y="115" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="526" y="116" width="418" height="38" fill="#FFF5EB"/>
<text x="536" y="142" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">2. Baseline: separate config</text>
<text x="536" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Freeze groups / paper / deadline</text>
<text x="536" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Save/resume; automatic timed finalization</text>
<text x="536" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Record diagnostics only for groups asked</text>
<rect x="1020" y="115" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="1021" y="116" width="418" height="38" fill="#FFF5EB"/>
<text x="1031" y="142" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">3. Request + initial Expert review</text>
<text x="1031" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">A needs learning =&gt; A alternatives only</text>
<text x="1031" y="203" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Do not add B from prerequisite edge yet</text>
<text x="1031" y="226" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Request locks BOTH Role and Level</text>
<rect x="1020" y="430" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="1021" y="431" width="418" height="38" fill="#FFF5EB"/>
<text x="1031" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">4. Learn one eligible alternative</text>
<text x="1031" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Requirement roots branch to choices</text>
<text x="1031" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Each module retains its own progress</text>
<text x="1031" y="541" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Content alone is not official achievement</text>
<rect x="525" y="430" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="526" y="431" width="418" height="38" fill="#FFF5EB"/>
<text x="536" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">5. Skill assessment: own config</text>
<text x="536" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Main + ALL configured prerequisite groups</text>
<text x="536" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Per-group pass / mandatory / optional veto</text>
<text x="536" y="541" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Every retake is a new FULL paper</text>
<rect x="30" y="430" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="31" y="431" width="418" height="38" fill="#EAF5EF"/>
<text x="41" y="457" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">6. Discover / record result</text>
<text x="41" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Missing B =&gt; Cần bổ sung + auto supplement</text>
<text x="41" y="518" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Official B failure =&gt; NEED_REVIEW only</text>
<text x="41" y="541" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Main waits on required conditions / veto</text>
<rect x="30" y="760" width="420" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="31" y="761" width="418" height="38" fill="#FFF5EB"/>
<text x="41" y="787" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">7. Complete / bypass-only release</text>
<text x="41" y="825" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Module + assessment OR approved certificate</text>
<text x="41" y="848" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Bypass is outstanding, never ACHIEVED</text>
<text x="41" y="871" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">No other mandatory pending work =&gt; release</text>
<rect x="750" y="760" width="690" height="155" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8"/><rect x="751" y="761" width="688" height="38" fill="#EAF5EF"/>
<text x="761" y="787" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0F172A">8. New target + parallel old needs</text>
<text x="761" y="825" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Carry old bypass context as parallel supplementary learning</text>
<text x="761" y="848" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Even if new module/certificate arrives: no new-target prerequisite gate</text>
<text x="761" y="871" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="#0F172A">Keep official / diagnostic / waived provenance distinct</text>
<rect x="458" y="160" width="44.0642852783203" height="21" fill="#FFFFFF"/>
<text x="460" y="176" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">scope</text>
<rect x="950" y="160" width="44.8133087158203" height="21" fill="#FFFFFF"/>
<text x="952" y="176" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">needs</text>
