<text x="1242" y="356" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">exact approval</text>
<rect x="952" y="476" width="50.0120391845703" height="21" fill="#FFFFFF"/>
<text x="954" y="492" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">assess</text>
<rect x="458" y="476" width="41.0745391845703" height="21" fill="#FFFFFF"/>
<text x="460" y="492" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">result</text>
<rect x="249" y="670" width="143.766906738281" height="21" fill="#FFFFFF"/>
<text x="251" y="686" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">required work resolved</text>
<rect x="477" y="806" width="193.653137207031" height="21" fill="#FFFFFF"/>
<text x="479" y="822" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">Employee selects another Role</text>
<text x="29" y="1003" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">Orange: changed owner   Green: new scoped data   Grey: retained structure</text>
<text x="29" y="1026" font-family="Arial, sans-serif" font-size="13" font-weight="normal" fill="#0F172A">TARGET DESIGN r3 | Not an applied database capture | Unrelated auth/content/billing retained</text>
</svg>