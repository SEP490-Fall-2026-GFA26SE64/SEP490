<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="2687" viewBox="0 0 1910 2687" role="img" aria-labelledby="title desc"><title id="title">ACT-02 - Renewal, seats and administrative access - Swimlane</title><desc id="desc">Actor-column swimlane activity diagram. All original steps, branches and return edges are retained. Line crossings do not indicate junctions.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="955" y="30" text-anchor="middle" font-size="20" fill="#0f1729">ACT-02 - Renewal, seats and administrative access - Swimlane</text><g data-lane="System Administrator"><rect x="35" y="58" width="460" height="2572" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="35" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="265" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">System Administrator</text></g><g data-lane="payOS"><rect x="495" y="58" width="460" height="2572" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="495" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="725" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">payOS</text></g><g data-lane="System Handler"><rect x="955" y="58" width="460" height="2572" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="955" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="1185" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">System Handler</text></g><g data-lane="Platform Administrator"><rect x="1415" y="58" width="460" height="2572" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="1415" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="1645" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">Platform Administrator</text></g><g class="node" data-node="SRS_ACT_02_N1" data-original="SRS_ACT_02_N1" data-actor="System Administrator" data-kind="terminal"><circle cx="265" cy="177" r="32" fill="#c24a0a" stroke="#c24a0a" stroke-width="1.5"/><text x="265" y="182" text-anchor="middle" font-size="15.5" fill="#ffffff">Start</text></g><g class="node" data-node="SRS_ACT_02_N2" data-original="SRS_ACT_02_N2" data-actor="System Administrator" data-kind="action"><rect x="115" y="301" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="332" text-anchor="middle" font-size="15.5" fill="#0f1729">Review period, Employee seats</text><text x="265" y="352" text-anchor="middle" font-size="15.5" fill="#0f1729">and payment history</text></g><g class="node" data-node="SRS_ACT_02_N3" data-original="SRS_ACT_02_N3" data-actor="System Administrator" data-kind="action"><rect x="115" y="465" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="496" text-anchor="middle" font-size="15.5" fill="#0f1729">Select existing renewal plan and</text><text x="265" y="516" text-anchor="middle" font-size="15.5" fill="#0f1729">confirm payment</text></g><g class="node" data-node="SRS_ACT_02_N9" data-original="SRS_ACT_02_N9" data-actor="System Administrator" data-kind="action"><rect x="115" y="1805" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="1836" text-anchor="middle" font-size="15.5" fill="#0f1729">Deactivate excess memberships or</text><text x="265" y="1856" text-anchor="middle" font-size="15.5" fill="#0f1729">resolve capacity</text></g><g class="node" data-node="SRS_ACT_02_N4" data-original="SRS_ACT_02_N4" data-actor="payOS" data-kind="action"><rect x="575" y="635" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="725" y="666" text-anchor="middle" font-size="15.5" fill="#0f1729">Provide signed payment outcome</text></g><g class="node" data-node="SRS_ACT_02_N5" data-original="SRS_ACT_02_N5" data-actor="System Handler" data-kind="decision"><polygon points="1185,785 1340,860 1185,935 1030,860" fill="#fef3eb" stroke="#e6650f" stroke-width="1.5"/><text x="1185" y="865" text-anchor="middle" font-size="15.5" fill="#0f1729">Full payment verified?</text></g><g class="node" data-node="SRS_ACT_02_N6" data-original="SRS_ACT_02_N6" data-actor="System Handler" data-kind="decision"><polygon points="1185,1049 1340,1124 1185,1199 1030,1124" fill="#fef3eb" stroke="#e6650f" stroke-width="1.5"/><text x="1185" y="1129" text-anchor="middle" font-size="15.5" fill="#0f1729">Seat capacity sufficient?</text></g><g class="node" data-node="SRS_ACT_02_N7" data-original="SRS_ACT_02_N7" data-actor="System Handler" data-kind="action"><rect x="1035" y="1477" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="1185" y="1508" text-anchor="middle" font-size="15.5" fill="#0f1729">Apply renewal and record paid</text><text x="1185" y="1528" text-anchor="middle" font-size="15.5" fill="#0f1729">period</text></g><g class="node" data-node="SRS_ACT_02_N8" data-original="SRS_ACT_02_N8" data-actor="System Handler" data-kind="action"><rect x="1035" y="1641" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="1185" y="1672" text-anchor="middle" font-size="15.5" fill="#0f1729">Retain paid order; show</text><text x="1185" y="1692" text-anchor="middle" font-size="15.5" fill="#0f1729">waiting-for-capacity state</text></g><g class="node" data-node="SRS_ACT_02_N10" data-original="SRS_ACT_02_N10" data-actor="System Handler" data-kind="action"><rect x="1035" y="1975" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="1185" y="2006" text-anchor="middle" font-size="15.5" fill="#0f1729">Re-evaluate pending application</text></g><g class="node" data-node="SRS_ACT_02_N11" data-original="SRS_ACT_02_N11" data-actor=