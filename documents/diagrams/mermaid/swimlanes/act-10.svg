<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1881" viewBox="0 0 1450 1881" role="img" aria-labelledby="title desc"><title id="title">ACT-10 - Question Bank authoring and approval - Swimlane</title><desc id="desc">Actor-column swimlane activity diagram. All original steps, branches and return edges are retained. Line crossings do not indicate junctions.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="725" y="30" text-anchor="middle" font-size="20" fill="#0f1729">ACT-10 - Question Bank authoring and approval - Swimlane</text><g data-lane="Responsible Expert"><rect x="35" y="58" width="460" height="1766" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="35" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="265" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">Responsible Expert</text></g><g data-lane="System Handler"><rect x="495" y="58" width="460" height="1766" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="495" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="725" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">System Handler</text></g><g data-lane="L&amp;D Manager"><rect x="955" y="58" width="460" height="1766" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="955" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="1185" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">L&amp;D Manager</text></g><g class="node" data-node="START" data-original="START" data-actor="Responsible Expert" data-kind="terminal"><circle cx="265" cy="177" r="32" fill="#c24a0a" stroke="#c24a0a" stroke-width="1.5"/><text x="265" y="182" text-anchor="middle" font-size="15.5" fill="#ffffff">Start</text></g><g class="node" data-node="CREATE" data-origina