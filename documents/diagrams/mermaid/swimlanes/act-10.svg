ef3eb" stroke="#e6650f" stroke-width="1.5"/><text x="1185" y="1207" text-anchor="middle" font-size="15.5" fill="#0f1729">Approve or Return?</text></g><g class="node" data-node="RETURN" data-original="RETURN" data-actor="System Handler" data-kind="action"><rect x="575" y="1391" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="725" y="1422" text-anchor="middle" font-size="15.5" fill="#0f1729">Record feedback and restore</text><text x="725" y="1442" text-anchor="middle" font-size="15.5" fill="#0f1729">DRAFT</text></g><g class="node" data-node="PUBLISHED" data-original="PUBLISHED" data-actor="System Handler" data-kind="action"><rect x="575" y="1561" width="300" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="725" y="1592" text-anchor="middle" font-size="15.5" fill="#0f1729">Publish immutable version</text></g><g class="node" data-node="END" data-original="END" data-actor="System Handler" data-kind="terminal"><circle cx="725" cy="1743" r="32" fill="#c24a0a" stroke="#c24a0a" stroke-width="1.5"/><text x="725" y="1748" text-anchor="middle" font-size="15.5" fill="#ffffff">End</text></g><path d="M265 216 L265 292" fill="none" stroke="white" stroke-width="4"/><path data-edge="START|CREATE|" d="M265 216 L265 292" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon data-arrowhead="START|CREATE|" points="261,283 265,292 269,283" fill="#64748b"/><path d="M265 380 L265 497 L566 497" fill="none" stroke="white" stroke-width="4"/><path data-edge="CREATE|DRAFT|" d="M265 380 L265 497 L566 497" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon data-arrowhead="CREATE|DRAFT|" points="557,501 566,497 557,493" fill="#64748b"/><path d="M725 530 L725 667 L424 667" fill="none" stroke="white" stroke-width="4"/><path data-edge="DRAFT|EDIT|" d="M725 530 L725 667 L424 667" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon data-arrowhead="DRAFT|EDIT|" points="433,663 424,667 433,671" fill="#64748b"/><pat