<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1909" viewBox="0 0 1450 1909" role="img" aria-labelledby="title desc"><title id="title">ACT-10 - Question Bank authoring and approval - Swimlane</title><desc id="desc">Actor-column swimlane activity diagram. All original steps, branches and return edges are retained. Line crossings do not indicate junctions.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="725" y="30" text-anchor="middle" font-size="20" fill="#0f1729">ACT-10 - Question Bank authoring and approval - Swimlane</text><g data-lane="Responsible Expert"><rect x="35" y="58" width="460" height="1794" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="35" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="265" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">Responsible Expert</text></g><g data-lane="System Handler"><rect x="495" y="58" width="460" height="1794" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="495" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="725" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">System Handler</text></g><g data-lane="L&amp;D Manager"><rect x="955" y="58" width="460" height="1794" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="955" y="58" width="460" height="52" fill="#fef3eb" stroke="#cbd5e1" stroke-width="1"/><text class="lane-header" x="1185" y="91" text-anchor="middle" font-size="19" font-weight="700" fill="#0f1729">L&amp;D Manager</text></g><g class="node" data-node="START" data-original="START" data-actor="Responsible Expert" data-kind="terminal"><circle cx="265" cy="177" r="32" fill="#c24a0a" stroke="#c24a0a" stroke-width="1.5"/><text x="265" y="182" text-anchor="middle" font-size="15.5" fill="#ffffff">Start</text></g><g class="node" data-node="CREATE" data-original="CREATE" data-actor="Responsible Expert" data-kind="action"><rect x="115" y="301" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="332" text-anchor="middle" font-size="15.5" fill="#0f1729">Create manually or import</text><text x="265" y="352" text-anchor="middle" font-size="15.5" fill="#0f1729">questions</text></g><g class="node" data-node="DRAFT" data-original="DRAFT" data-actor="System Handler" data-kind="action"><rect x="575" y="471" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="725" y="502" text-anchor="middle" font-size="15.5" fill="#0f1729">Save as DRAFT</text></g><g class="node" data-node="EDIT" data-original="EDIT" data-actor="Responsible Expert" data-kind="action"><rect x="115" y="643" width="300" height="92" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="674" text-anchor="middle" font-size="15.5" fill="#0f1729">Complete exact Skill, knowledge,</text><text x="265" y="694" text-anchor="middle" font-size="15.5" fill="#0f1729">outcome, mandatory flag and four</text><text x="265" y="714" text-anchor="middle" font-size="15.5" fill="#0f1729">options</text></g><g class="node" data-node="SUBMIT" data-original="SUBMIT" data-actor="Responsible Expert" data-kind="action"><rect x="115" y="833" width="300" height="52" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="265" y="864" text-anchor="middle" font-size="15.5" fill="#0f1729">Submit for review</text></g><g class="node" data-node="REVIEW" data-original="REVIEW" data-actor="L&amp;D Manager" data-kind="action"><rect x="1035" y="983" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="1185" y="1014" text-anchor="middle" font-size="15.5" fill="#0f1729">Review and acknowledge exact</text><text x="1185" y="1034" text-anchor="middle" font-size="15.5" fill="#0f1729">version</text></g><g class="node" data-node="DECISION" data-original="DECISION" data-actor="L&amp;D Manager" data-kind="decision"><polygon points="1185,1147 1340,1222 1185,1297 1030,1222" fill="#fef3eb" stroke="#e6650f" stroke-width="1.5"/><text x="1185" y="1227" text-anchor="middle" font-size="15.5" fill="#0f1729">Approve or Return?</text></g><g class="node" data-node="RETURN" data-original="RETURN" data-actor="System Handler" data-kind="action"><rect x="575" y="1411" width="300" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="725" y="1442" text-anchor="middle" font-size="15.5" fill="#0f1729">Record feedback and restore</text><text x="725" y="1462" text-anchor="middle" font-size="15.5" fill="#0f1729">DRAFT</text></g><g class="node" data-node="PUBLISHED" data-original="PUBLISHED" data-actor="System Handler" data-kind="action"><rect x="575" y="1575" width="300" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="725" y="1606" text-anchor="middle" font-size="15.5" fill="#0f1729">Publish immutable version;</text><text x="725" y="1626" text-anchor="middle" font-size="15.5" fill="#0f1729">retain owned source-bank mapping</text></g><g class="node" data-node="END" data-original="END" data-actor="System Handler" data-kind="terminal"><circle cx="725" cy="1771" r="32" fill="#c24a0a" stroke="#c24a0a" stroke-width="1.5"/><text x="725" y="1776" text-anchor="middle" font-size="15.5" fill="#ffffff">End</text></g><path d="M265 216 L265 292" fill="none" stroke="white" stroke-width="4"/><path data-edge="START|CREATE|" d="M265 216 L265 292" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon data-arrowhead="START|CREATE|" points="261,283 265,292 269,283" fill="#64748b"/><path d="M265 380 L265 497 L566 497" fill="none" stroke="white" stroke-width="4"/><path data-edge="CREATE|DRAFT|" d="M265 380 L265 497 L566 497" fill="none" stroke="#64748b" stroke-width="1.3"/><polygon data-arrowhead="CREATE|DRAFT|" points="557,501 566,497 557,493" fill="#64748b"/><path d="M725 530 L725 677 L424 677" fill="non