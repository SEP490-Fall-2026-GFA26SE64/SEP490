<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" font-family="Segoe UI, Arial, sans-serif"><style>text{font-family:Segoe UI,Arial,sans-serif}</style><defs><marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="750" y="29" text-anchor="middle" fill="#0f1729" font-size="19">SEQ-13 — Certificate definition review and publication</text><line x1="110" y1="142" x2="110" y2="1215" stroke="#64748b" stroke-width="1"/><circle cx="110" cy="68" r="9" fill="white" stroke="#e6650f" stroke-width="2"/><path d="M110 77 v28 m-16 -19 h32 m-16 19 l-14 18 m14 -18 l14 18" fill="none" stroke="#e6650f" stroke-width="2"/><text x="110" y="139" text-anchor="middle" font-size="15" fill="#0f1729">Expert</text><line x1="375" y1="142" x2="375" y2="1215" stroke="#64748b" stroke-width="1"/><circle cx="375" cy="68" r="9" fill="white" stroke="#e6650f" stroke-width="2"/><path d="M375 77 v28 m-16 -19 h32 m-16 19 l-14 18 m14 -18 l14 18" fill="none" stroke="#e6650f" stroke-width="2"/><text x="375" y="139" text-anchor="middle" font-size="15" fill="#0f1729">L&D Manager</text><line x1="640" y1="111" x2="640" y2="1215" stroke="#64748b" stroke-width="1"/><rect x="537" y="55" width="206" height="56" rx="3" fill="#fef3eb" stroke="#e6650f"/><text x="640" y="88" text-anchor="middle" font-size="14" fill="#0f1729">CertificateAuthoringService</text><line x1="935" y1="111" x2="935" y2="1215" stroke="#64748b" stroke-width="1"/><rect x="832" y="55" width="206" height="56" rx="3" fill="#fef3eb" stroke="#e6650f"/><text x="935" y="88" text-anchor="middle" font-size="14" fill="#0f1729">PostgreSQL authoring store</text><line x1="1260" y1="111" x2="1260" y2="1215" stroke="#64748b" stroke-width="1"/><rect x="1157" y="55" width="206" height="56" rx="3" fill="#fef3eb" stroke="#e6650f"/><text x="1260" y="88" text-anchor="middle" font-size="14" fill="#0f1729">Neo4j certificate catalog</text><text x="375" y="183" text-anchor="middle" font-size="14" fill="#0f1729">Import or select exact Skill</text><text x="375" y="201" text-anchor="middle" font-size="14" fill="#0f1729">and knowledge rows</text><line x1="110" y1="215" x2="640" y2="215" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="123" cy="215" r="10" fill="#64748b"/><text x="123" y="219" text-anchor="middle" fill="white" font-size="12">1</text><text x="787.5" y="261" text-anchor="middle" font-size="14" fill="#0f1729">Retain owned drafts,</text><text x="787.5" y="279" text-anchor="middle" font-size="14" fill="#0f1729">batch receipt and events</text><line x1="640" y1="293" x2="935" y2="293" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="293" r="10" fill="#64748b"/><text x="653" y="297" text-anchor="middle" fill="white" font-size="12">2</text><text x="375" y="339" text-anchor="middle" font-size="14" fill="#0f1729">Submit expected draft revision</text><line x1="110" y1="371" x2="640" y2="371" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="123" cy="371" r="10" fill="#64748b"/><text x="123" y="375" text-anchor="middle" fill="white" font-size="12">3</text><text x="787.5" y="417" text-anchor="middle" font-size="14" fill="#0f1729">SUBMITTED and staff in-app</text><text x="787.5" y="435" text-anchor="middle" font-size="14" fill="#0f1729">review notification</text><line x1="640" y1="449" x2="935" y2="449" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="449" r="10" fill="#64748b"/><text x="653" y="453" text-anchor="middle" fill="white" font-size="12">4</text><text x="507.5" y="495" text-anchor="middle" font-size="14" fill="#0f1729">View exact revision,</text><text x="507.5" y="513" text-anchor="middle" font-size="14" fill="#0f1729">then approve or reject</text><line x1="375" y1="527" x2="640" y2="527" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="388" cy="527" r="10" fill="#64748b"/><text x="388" y="531" text-anchor="middle" fill="white" font-size="12">5</text><text x="787.5" y="573" text-anchor="middle" font-size="14" fill="#0f1729">Viewed acknowledgement</text><text x="787.5" y="591" text-anchor="middle" font-size="14" fill="#0f1729">and retained decision</text><line x1="640" y1="605" x2="935" y2="605" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="605" r="10" fill="#64748b"/><text x="653" y="609" text-anchor="middle" fill="white" font-size="12">6</text><text x="720" y="651" text-anchor="middle" font-size="14" fill="#0f1729">Background publishOne</text><text x="720" y="669" text-anchor="middle" font-size="14" fill="#0f1729">claims eligible PUBLISHING row</text><path d="M640 683 h160 v19 h-160" fill="none" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="683" r="10" fill="#64748b"/><text x="653" y="687" text-anchor="middle" fill="white" font-size="12">7</text><text x="950" y="729" text-anchor="middle" font-size="14" fill="#0f1729">Validate and publish using</text><text x="950" y="747" text-anchor="middle" font-size="14" fill="#0f1729">stable command identity</text><line x1="640" y1="761" x2="1260" y2="761" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="761" r="10" fill="#64748b"/><text x="653" y="765" text-anchor="middle" fill="white" font-size="12">8</text><text x="950" y="807" text-anchor="middle" font-size="14" fill="#0f1729">Published definition ID/version</text><line x1="1260" y1="839" x2="640" y2="839" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#call)"/><circle cx="1247" cy="839" r="10" fill="#64748b"/><text x="1247" y="843" text-anchor="middle" fill="white" font-size="12">9</text><text x="787.5" y="885" text-anchor="middle" font-size="14" fill="#0f1729">PUBLISHED event and author</text><text x="787.5" y="903" text-anchor="middle" font-size="14" fill="#0f1729">in-app notification</text><line x1="640" y1="917" x2="935" y2="917" stroke="#64748b" stroke-width="1.3" marker-end="url(#call)"/><circle cx="653" cy="917" r="10" fill="#64748b"/><text x="653" y="921" text-anchor="middle" fill="white" font-size="12">10</text><rect x="520" y="620" width="870" height="359" fill="none" stroke="#64748b" stroke-width="1"/><text x="535" y="636" font-size="13" fill="#0f1729">opt — Approved: PUBLISHING</text><rect x="170" y="1015" width="1160" height="43" fill="#fef3eb" stroke="#e6650f"/><text x="750" y="1040" text-anchor="middle" font-size="15" fill="#0f1729">Reject requires a reason; approval reason is optional. Reject stops publication.</text><rect x="170" y="1075" width="1160" height="43" fill="#fef3eb" stroke="#e6650f"/><text x="750" y="1100" text-anchor="middle" font-size="15" fill="#0f1729">Publication retries are bounded; failure remains visible as PUBLISH_FAILED.</text><rect x="170" y="1135" width="1160" height="43" fill="#fef3eb" stroke="#e6650f"/><text x="750" y="1160" text-anchor="middle" font-size="15" fill="#0f1729">Existing pathways retain pinned A; new pathways use B after publication.</text></svg>
