<text x="76" y="619" font-size="19" font-weight="650" fill="#9a3412">RIASEC profile rules</text>
<text x="76" y="650" font-size="16" font-weight="400" fill="#0f172a">All six integer 0–40, or all absent; missing is not zero.</text>
<text x="76" y="675" font-size="16" font-weight="400" fill="#0f172a">Six zeros are valid. Demo/organization profiles.</text>
<rect x="60" y="1980" width="1520" height="112" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="76" y="2010" font-size="19" font-weight="650" fill="#9a3412">Personal state belongs to PostgreSQL V72</text>
<text x="76" y="2041" font-size="16" font-weight="400" fill="#0f172a">Draft, answers, six raw scores, history, AI jobs and snapshots.</text>
<text x="76" y="2066" font-size="16" font-weight="400" fill="#0f172a">No personal results, learning progress or evidence on these catalog nodes.</text>
<text x="60" y="2130" font-size="20" font-weight="650" fill="#0f172a">Relationship properties — no new RIASEC node or relationship</text>
<text x="60" y="2170" font-size="17" font-weight="400" fill="#0f172a">HAS_ROLE / HAS_LEVEL / HAS_COMPETENCY / HAS_SKILL: id, version, status, reviewStatus (String)</text>
<text x="60" y="2207" font-size="17" font-weight="400" fill="#0f172a">REQUIRES_SKILL: id, requiredKnowledgeLevels (String[]), isMandatory (Boolean), version, status, reviewStatus</text>
<text x="60" y="2244" font-size="17" font-weight="400" fill="#0f172a">TEACHES: id, organizationId, version, status, reviewStatus, reviewSource (String)</text>
<text x="60" y="2281" font-size="17" font-weight="400" fill="#0f172a">HAS_SKILL_PREREQUISITE: id, organizationId, prerequisiteKnowledgeLevel, dependentKnowledgeLevel,</text>
<text x="60" y="2318" font-size="17" font-weight="400" fill="#0f172a">    version, status, reviewStatus, reviewSource (String)</text>
<text x="60" y="2355" font-size="17" font-weight="400" fill="#0f172a">REQUIRES_CERTIFICATE: organizationId, status, createdBy, createdAt; optional replacedBy, replacedByActor, replacedAt (String)</text>
<text x="60" y="2392" font-size="17" font-weight="400" fill="#0f172a">Timestamps remain ISO text. Certificate/REQUIRES_CERTIFICATE were absent from the earlier supplied capture.</text>
<text x="60" y="2429" font-size="17" font-weight="400" fill="#0f172a">[UNIQUE] = source-defined ID constraint; deployment not verified. No cardinalities inferred from the capture.</text>
