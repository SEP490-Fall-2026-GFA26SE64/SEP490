spring:
  servlet:
    multipart:
      max-file-size: 10240MB
      max-request-size: 10241MB
      file-size-threshold: 0
  application:
    name: adapt-learn-graph
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/adapt_learn_graph}
    username: ${DB_USER:adapt_learn_graph}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: platform.registration_session
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
registration:
  encryption-key: ${REGISTRATION_ENCRYPTION_KEY:}
  hmac-key: ${REGISTRATION_HMAC_KEY:}
  mail-from: ${SMTP_FROM:}
  cookie-secure: ${REGISTRATION_COOKIE_SECURE:true}
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
subscription:
  public-url: ${SUBSCRIPTION_PUBLIC_URL:http://127.0.0.1:8088}
  worker:
    enabled: ${SUBSCRIPTION_WORKER_ENABLED:true}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
learning:
  assets:
    endpoint: ${LEARNING_ASSETS_ENDPOINT:http://localhost:28190}
    access-key: ${LEARNING_ASSETS_ACCESS_KEY:unconfigured}
    secret-key: ${LEARNING_ASSETS_SECRET_KEY:unconfigured}
    bucket: ${LEARNING_ASSETS_BUCKET:learning-content}
  mail:
    enabled: ${LEARNING_MAIL_ENABLED:false}
