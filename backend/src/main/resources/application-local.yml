spring:
  flyway:
    enabled: false

catalog:
  local-actor:
    enabled: ${CATALOG_LOCAL_ACTOR_ENABLED:true}
    account-id: ${CATALOG_LOCAL_ACTOR_ACCOUNT_ID:00000000-0000-0000-0000-000000000001}
    organization-id: ${CATALOG_LOCAL_ACTOR_ORGANIZATION_ID:00000000-0000-0000-0000-000000000001}
    active: ${CATALOG_LOCAL_ACTOR_ACTIVE:true}
    role: ${CATALOG_LOCAL_ACTOR_ROLE:EMPLOYEE}

learning:
  target-selection:
    local-dependencies:
      enabled: ${TARGET_SELECTION_LOCAL_DEPENDENCIES_ENABLED:true}
      assessment-in-progress: ${TARGET_SELECTION_LOCAL_ASSESSMENT_IN_PROGRESS:false}

research:
  enabled: ${RESEARCH_ENABLED:false}
  source: ${RESEARCH_SOURCE:../documents/dataset/import/ontology_seed.json}
  rules: ${RESEARCH_RULES:../documents/research/RQ2/RULES.md}
  neo4j-uri: ${RESEARCH_NEO4J_URI:bolt://localhost:17687}
  neo4j-user: ${RESEARCH_NEO4J_USER:neo4j}
  neo4j-password: ${RESEARCH_NEO4J_PASSWORD:local-only-research-neo4j}
  environment-label: ${RESEARCH_ENVIRONMENT_LABEL:Local environment; hardware limits not specified}

assessment:
  baseline:
    legacy-authoring:
      # Historical fixed Generate/Review/Publish wiring; never the official baseline fallback.
      enabled: false
    answer-review:
      # Temporary local/demo reveal boundary. Production has no matching bean/controller.
      enabled: ${BASELINE_ANSWER_REVIEW_ENABLED:false}
    occupation-catalog:
      # Opt-in only: ontology 0.8 currently has no production tenant/publication mapping.
      enabled: ${BASELINE_OCCUPATION_CATALOG_ENABLED:false}
