name: adapt-learn-graph
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: adapt_learn_graph
      POSTGRES_USER: adapt_learn_graph
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapt_learn_graph -d adapt_learn_graph"]
      interval: 10s
      timeout: 5s
      retries: 10
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your environment or .env}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    profiles: ["app"]
    image: adapt-learn-graph-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-environment
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/adapt_learn_graph
      DB_USER: adapt_learn_graph
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  migrate:
    profiles: ["app", "tools"]
    image: adapt-learn-graph-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: local,migrate
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
  web:
    profiles: ["app"]
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - api
volumes:
  postgres_data:
  neo4j_data: